name: verification

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Deterministic verification harness
        run: make test

      - name: Sanitizer-focused harness (ASan + UBSan)
        run: make test-sanitize
